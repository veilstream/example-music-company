name: Preview smoke

on:
  pull_request:

concurrency:
  group: preview-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      # Action repo is private while we test — clone it with a read token, then use locally.
      # Once veilstream/veilstream-github-action is public, replace this + the local uses with:
      #   uses: veilstream/veilstream-github-action@v1
      - name: Checkout VeilStream wait action
        uses: actions/checkout@v4
        with:
          repository: veilstream/veilstream-github-action
          ref: main
          path: ./.veilstream-wait
          token: ${{ secrets.VEILSTREAM_GH_TOKEN }}

      - id: vs
        name: Wait for VeilStream preview
        uses: ./.veilstream-wait
        with:
          api_key: ${{ secrets.VEILSTREAM_API_KEY }}
          region: ovh-ca

      - name: Smoke preview URL
        env:
          BASE_URL: ${{ steps.vs.outputs.preview_url }}
        run: |
          set -euo pipefail
          echo "preview_url=${BASE_URL}"
          echo "region=${{ steps.vs.outputs.region }}"
          echo "deployment_id=${{ steps.vs.outputs.deployment_id }}"
          # Frontend
          curl -fsS -o /dev/null -w "frontend %{http_code}\n" --retry 5 --retry-delay 2 --retry-all-errors "${BASE_URL}/"
          # API (Chinook artists) — try /api and stripped-prefix forms
          if curl -fsS --retry 3 --retry-delay 2 "${BASE_URL}/api/artists" | head -c 200; then
            echo
          elif curl -fsS --retry 3 --retry-delay 2 "${BASE_URL}/artists" | head -c 200; then
            echo
          else
            echo "API smoke failed against ${BASE_URL}" >&2
            exit 1
          fi
